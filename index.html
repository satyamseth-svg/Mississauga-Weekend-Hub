<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mississauga Weekend Crew — Monthly Performance</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --primary: #2563eb; --primary-dark: #1d4ed8; 
    --success: #059669; --warning: #d97706; --danger: #dc2626;
    --bg-main: #f1f5f9; --bg-card: #ffffff; --bg-inner: #f8fafc;
    --border: #e2e8f0; --text-main: #0f172a; --text-muted: #64748b;
    --sup-morning: #e0f2fe; --sup-evening: #fef3c7; --sup-night: #e0e7ff;   
    --sup-morning-border: #bae6fd; --sup-evening-border: #fde68a; --sup-night-border: #c7d2fe;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'DM Sans', sans-serif; background: var(--bg-main); color: var(--text-main); min-height: 100vh; -webkit-print-color-adjust: exact; print-color-adjust: exact; }

  /* Setup Page */
  #setup-page { display: flex; flex-direction: column; align-items: center; padding: 40px 20px; max-width: 800px; margin: 0 auto; }
  .setup-card { background: var(--bg-card); border-radius: 24px; padding: 40px; width: 100%; border: 1px solid var(--border); box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1); }
  h1 { font-size: 24px; font-weight: 900; margin-bottom: 20px; text-align: center; color: var(--text-main); }
  
  .input-group { margin-bottom: 25px; width: 100%; }
  label { display: block; font-weight: 800; margin-bottom: 8px; font-size: 14px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }
  input[type="date"], input[type="text"], input[type="number"], textarea { width: 100%; padding: 14px; border: 2px solid var(--border); border-radius: 12px; background: #fff; color: var(--text-main); font-family: 'Space Mono', monospace; font-size: 14px; transition: border-color 0.2s; }
  textarea { height: 100px; resize: vertical; font-size: 12px; }
  textarea:focus, input:focus { outline: none; border-color: var(--primary); }
  
  /* Drag and Drop File Inputs */
  .file-drop-area { border: 2px dashed var(--border); border-radius: 12px; padding: 25px 20px; text-align: center; cursor: pointer; background: var(--bg-inner); transition: all 0.2s; margin-bottom: 15px; position: relative; }
  .file-drop-area:hover { border-color: var(--primary); background: #eff6ff; }
  .file-drop-area input[type="file"] { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }
  .file-label { font-weight: 800; font-size: 15px; color: var(--primary); pointer-events: none; }
  .file-sub { font-size: 12px; color: var(--text-muted); margin-top: 5px; pointer-events: none; }
  
  /* Settings Accordion */
  .settings-panel { margin-bottom: 25px; border: 2px solid var(--border); border-radius: 12px; background: var(--bg-inner); overflow: hidden; }
  .settings-panel summary { padding: 16px; font-weight: 800; cursor: pointer; background: #fff; outline: none; user-select: none; color: var(--text-main); }
  .settings-panel summary:hover { background: #f8fafc; }
  .settings-content { padding: 20px; border-top: 1px solid var(--border); }
  .settings-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 15px; }
  
  button.primary-btn { width: 100%; padding: 16px; background: var(--primary); color: white; border: none; border-radius: 12px; font-weight: 800; font-size: 16px; cursor: pointer; transition: all 0.2s ease; box-shadow: 0 4px 6px -1px rgba(37, 99, 235, 0.2); margin-top: 10px; }
  button.primary-btn:hover { background: var(--primary-dark); transform: translateY(-2px); box-shadow: 0 10px 15px -3px rgba(37, 99, 235, 0.3); }
  button.secondary-btn { width: 100%; padding: 12px; background: #fff; color: var(--primary); border: 2px solid var(--primary); border-radius: 12px; font-weight: 800; font-size: 14px; cursor: pointer; margin-bottom: 20px; transition: all 0.2s; display: none; }
  button.secondary-btn:hover { background: #eff6ff; }

  /* Dashboard Styles */
  #dashboard-output { display: none; padding: 20px 20px 100px 20px; min-height: 100vh; }
  
  /* Top Control Bar */
  .control-bar { display: flex; justify-content: space-between; align-items: center; max-width: 1800px; margin: 0 auto 20px auto; background: #fff; padding: 15px 25px; border-radius: 16px; border: 1px solid var(--border); box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
  .controls-left { display: flex; gap: 15px; align-items: center; flex: 1; }
  .controls-right { display: flex; gap: 10px; }
  
  .search-box { flex: 1; max-width: 300px; position: relative; }
  .search-box input { width: 100%; padding: 10px 15px; border-radius: 8px; border: 2px solid var(--border); font-family: 'DM Sans', sans-serif; font-weight: 600; }
  .sort-box select { padding: 10px 15px; border-radius: 8px; border: 2px solid var(--border); font-family: 'DM Sans', sans-serif; font-weight: 700; color: var(--text-main); background: #fff; cursor: pointer;}
  
  .action-btn { background: var(--bg-card); border: 2px solid var(--border); padding: 10px 20px; border-radius: 10px; font-weight: 800; cursor: pointer; color: var(--text-main); transition: all 0.2s; }
  .action-btn:hover { background: var(--bg-inner); border-color: var(--primary); color: var(--primary); }
  .action-btn.accent { background: var(--primary); border-color: var(--primary); color: white; }
  .action-btn.accent:hover { background: var(--primary-dark); border-color: var(--primary-dark); color: white; }
  .action-btn.download { background: #059669; border-color: #059669; color: white; }
  .action-btn.download:hover { background: #047857; border-color: #047857; color: white; box-shadow: 0 4px 12px rgba(5,150,105,0.3); }

  /* Day Switcher Tabs */
  .day-tabs-wrap { max-width: 1800px; margin: 0 auto 18px auto; display: flex; align-items: center; gap: 14px; background: #fff; padding: 12px 18px; border-radius: 14px; border: 1px solid var(--border); box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
  .day-tabs-label { font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-muted); white-space: nowrap; }
  .day-tabs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; flex: 1; scrollbar-width: thin; }
  .day-tabs::-webkit-scrollbar { height: 6px; }
  .day-tabs::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }
  .day-tab { position: relative; display: inline-flex; align-items: center; gap: 8px; padding: 8px 12px 8px 14px; border-radius: 10px; border: 2px solid var(--border); background: #fff; color: var(--text-muted); font-weight: 800; font-size: 13px; cursor: pointer; white-space: nowrap; transition: all 0.15s ease; font-family: 'DM Sans', sans-serif; }
  .day-tab:hover { border-color: var(--primary); color: var(--primary); }
  .day-tab.active { background: var(--primary); border-color: var(--primary); color: #fff; box-shadow: 0 4px 10px rgba(37,99,235,0.25); }
  .day-tab .day-tab-sub { font-size: 10px; font-weight: 700; opacity: 0.85; font-family: 'Space Mono', monospace; }
  .day-tab-remove { display: inline-flex; align-items: center; justify-content: center; width: 18px; height: 18px; border-radius: 50%; background: rgba(0,0,0,0.08); color: inherit; font-size: 14px; font-weight: 900; line-height: 1; cursor: pointer; flex-shrink: 0; transition: all 0.15s; }
  .day-tab.active .day-tab-remove { background: rgba(255,255,255,0.25); }
  .day-tab-remove:hover { background: var(--danger); color: #fff; }
  .day-add-tab { padding: 8px 16px; border-radius: 10px; border: 2px dashed var(--border); background: var(--bg-inner); color: var(--primary); font-weight: 800; font-size: 13px; cursor: pointer; white-space: nowrap; transition: all 0.15s ease; font-family: 'DM Sans', sans-serif; flex-shrink: 0; }
  .day-add-tab:hover { border-color: var(--primary); background: #eff6ff; }

  /* Archive controls */
  .day-tab-archive { display:inline-flex; align-items:center; justify-content:center; width:20px; height:20px; border-radius:6px; background:rgba(0,0,0,0.07); color:inherit; font-size:11px; line-height:1; cursor:pointer; flex-shrink:0; transition:all 0.15s; }
  .day-tab.active .day-tab-archive { background:rgba(255,255,255,0.22); }
  .day-tab-archive:hover { background:var(--primary); color:#fff; }
  .day-archive-btn { padding:8px 14px; border-radius:10px; border:2px solid var(--border); background:var(--bg-inner); color:var(--text-main); font-weight:800; font-size:13px; cursor:pointer; white-space:nowrap; transition:all 0.15s; flex-shrink:0; align-items:center; gap:6px; }
  .day-archive-btn:hover { border-color:var(--primary); color:var(--primary); }
  .arch-count-badge { background:var(--primary); color:#fff; border-radius:20px; padding:1px 8px; font-size:11px; font-weight:800; font-family:'Space Mono',monospace; }
  .archived-banner { max-width:1800px; margin:0 auto 14px auto; background:#fff7ed; border:1px solid #fed7aa; color:#9a3412; border-radius:12px; padding:10px 16px; font-size:13px; font-weight:700; display:none; align-items:center; gap:12px; }
  body.dark .archived-banner { background:#2a1c0e; border-color:#7c5310; color:#fbbf24; }
  .arch-inline-restore { background:#ea580c; color:#fff; border:none; border-radius:8px; padding:6px 12px; font-weight:800; cursor:pointer; font-size:12px; }
  .arch-inline-restore:hover { background:#c2410c; }
  .arch-row { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:12px 14px; border:1px solid var(--border); border-radius:12px; margin-bottom:10px; background:var(--bg-inner); flex-wrap:wrap; }
  .arch-info { display:flex; flex-direction:column; gap:2px; }
  .arch-date { font-weight:900; font-size:14px; color:var(--text-main); }
  .arch-meta { font-size:11px; color:var(--text-muted); font-weight:700; font-family:'Space Mono',monospace; }
  .arch-actions { display:flex; gap:8px; flex-wrap:wrap; }
  .arch-btn { border:2px solid var(--border); background:var(--bg-card); color:var(--text-main); border-radius:9px; padding:7px 12px; font-weight:800; font-size:12px; cursor:pointer; transition:all 0.15s; }
  .arch-btn.restore:hover { border-color:var(--success); color:var(--success); }
  .arch-btn.view:hover { border-color:var(--primary); color:var(--primary); }
  .arch-btn.del:hover { border-color:var(--danger); color:var(--danger); }

  .header { text-align: center; margin-bottom: 20px; font-weight: 900; font-size: 28px; color: var(--text-main); text-transform: uppercase; letter-spacing: 1px; }
  
  /* Global Summary Tabs */
  .global-tabs-container { display: flex; flex-direction: column; gap: 15px; max-width: 1800px; margin: 0 auto 30px auto; }
  .benchmark-bar { background: var(--bg-card); color: var(--text-muted); padding: 14px 20px; border-radius: 16px; display: flex; justify-content: center; flex-wrap: wrap; gap: 30px; font-size: 13px; font-weight: 800; border: 1px solid var(--border); box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
  .benchmark-bar span { color: #fff; background: var(--primary); padding: 4px 12px; border-radius: 8px; margin-left: 8px; font-family: 'Space Mono', monospace; }
  
  .global-summary { display: flex; justify-content: space-around; background: var(--bg-card); padding: 25px; border-radius: 20px; border: 1px solid var(--border); box-shadow: 0 10px 15px -3px rgba(0,0,0,0.05); }
  .global-metric { text-align: center; border-right: 1px solid var(--border); flex: 1; }
  .global-metric:last-child { border-right: none; }
  .global-metric .lbl { font-size: 14px; color: var(--text-muted); text-transform: uppercase; font-weight: 800; letter-spacing: 1px;}
  .global-metric .val { font-size: 36px; font-weight: 900; margin: 8px 0; letter-spacing: -1px;}
  .global-metric .sub { font-size: 13px; color: var(--text-main); font-weight: 700; background: var(--bg-inner); display: inline-block; padding: 6px 16px; border-radius: 30px; border: 1px solid var(--border); font-family: 'Space Mono', monospace;}
  
  .grid { display: flex; gap: 24px; max-width: 1800px; margin: 0 auto; align-items: flex-start; }
  
  /* Columns & Cards */
  .col { flex: 1; padding: 24px; border-radius: 24px; border: 2px solid var(--border); box-shadow: 0 10px 15px -3px rgba(0,0,0,0.05); min-width: 0; }
  .col.morning { background: var(--sup-morning); border-color: var(--sup-morning-border); }
  .col.evening { background: var(--sup-evening); border-color: var(--sup-evening-border); }
  .col.night { background: var(--sup-night); border-color: var(--sup-night-border); }
  
  .sup { text-align: center; font-weight: 900; font-size: 22px; margin-bottom: 20px; color: var(--text-main); }
  
  .team { background: rgba(255,255,255,0.7); padding: 20px; border-radius: 18px; margin-bottom: 24px; border: 1px solid rgba(0,0,0,0.05); backdrop-filter: blur(10px); }
  .sup-data-row { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px dashed rgba(0,0,0,0.1); margin-bottom: 12px; padding-bottom: 12px; }
  .sup-data-label { font-weight: 800; color: var(--text-muted); font-size: 11px; text-transform: uppercase; letter-spacing: 1px; }
  .badge-staff { background: var(--primary); color: white; padding: 6px 16px; border-radius: 30px; font-weight: 800; font-size: 13px; box-shadow: 0 2px 4px rgba(37,99,235,0.2);}
  
  .team-table { width: 100%; border-collapse: collapse; font-size: 12px; margin-bottom: 15px; }
  .team-table th { text-align: left; color: var(--text-muted); text-transform: uppercase; border-bottom: 2px solid rgba(0,0,0,0.05); padding: 10px 0; font-size: 10px; font-weight: 800; letter-spacing: 0.5px;}
  .team-table td { padding: 10px 0; border-bottom: 1px solid rgba(0,0,0,0.05); font-weight: 700; color: var(--text-main); }
  .team-table th:nth-child(n+2), .team-table td:nth-child(n+2) { text-align: right; }

  /* Interactive Cards & Tooltips */
  .card { background: var(--bg-card); border-radius: 18px; padding: 18px; margin-bottom: 16px; border: 2px solid var(--border); position: relative; transition: transform 0.25s cubic-bezier(0.34,1.56,0.64,1), box-shadow 0.25s ease, border-color 0.2s ease; cursor: pointer; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
  .card:hover { border-color: var(--primary); transform: translateY(-6px) scale(1.01); box-shadow: 0 24px 40px -8px rgba(37,99,235,0.18); z-index: 200; }
  .card.pinned { border-width: 3px; border-color: var(--success); transform: translateY(-6px) scale(1.01); box-shadow: 0 24px 40px -8px rgba(16,185,129,0.18); z-index: 200; }

  /* Tooltip — opacity/transform based (smooth, no flicker) */
  .tt-container {
    opacity: 0; visibility: hidden; pointer-events: none;
    position: absolute; bottom: calc(100% + 14px); left: 50%;
    transform: translateX(-50%) translateY(10px);
    width: 440px; background: rgba(15,23,42,0.97);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    color: #fff; padding: 24px; border-radius: 20px;
    box-shadow: 0 32px 64px -12px rgba(0,0,0,0.6), 0 0 0 1px rgba(255,255,255,0.08);
    border: 2px solid rgba(99,102,241,0.5);
    z-index: 9999;
    transition: opacity 0.22s ease, transform 0.22s cubic-bezier(0.34,1.2,0.64,1), visibility 0s linear 0.22s;
  }
  .card:hover .tt-container, .card.pinned .tt-container {
    opacity: 1; visibility: visible; pointer-events: auto;
    transform: translateX(-50%) translateY(0);
    transition: opacity 0.22s ease, transform 0.22s cubic-bezier(0.34,1.2,0.64,1), visibility 0s linear 0s;
  }
  .card.pinned .tt-container { border-color: rgba(16,185,129,0.6); }
  .card.pinned .tt-container::after { border-top-color: rgba(16,185,129,0.8); }
  .tt-container::after { content: ''; position: absolute; top: 100%; left: 50%; margin-left: -8px; border-width: 8px; border-style: solid; border-color: rgba(99,102,241,0.6) transparent transparent transparent; }

  .tt-header { font-size: 20px; font-weight: 900; color: #fff; margin-bottom: 14px; text-align: center; letter-spacing: -0.3px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 12px; }
  
  .tt-info-grid { display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; font-size: 12px; color: #94a3b8; background: rgba(255,255,255,0.04); padding: 12px 14px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.08); }
  .tt-info-grid .info-row { display: flex; justify-content: space-between; align-items: center; }
  .tt-info-grid span:first-child { color: #94a3b8; font-weight: 600; font-size: 11px; } .tt-info-grid span:last-child { color: #f1f5f9; font-weight: 800; font-size: 12px; }
  
  .tt-row { display: flex; justify-content: space-between; font-size: 13px; color: #cbd5e1; margin-bottom: 8px; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.07); padding-bottom: 7px; font-weight: 600; }
  .tt-row:last-child { border-bottom: none; }
  .tt-row .val { font-weight: 900; font-size: 14px; font-family: 'Space Mono', monospace; letter-spacing: -0.5px; }
  .tt-sub-row { font-size: 11px; color: #64748b; margin-top: -4px; margin-bottom: 8px; padding: 3px 0 3px 14px; display: flex; justify-content: space-between; font-weight: 600; background: rgba(255,255,255,0.02); border-radius: 4px; }
  .tt-sub-row span { color: #e2e8f0; font-family: 'Space Mono', monospace; }
  .tt-pack-table { width: 100%; border-collapse: collapse; font-size: 12px; margin: 8px 0 10px 0; background: rgba(255,255,255,0.05); border-radius: 10px; overflow: hidden; }
  .tt-pack-table th { text-align: left; padding: 8px 10px; color: #64748b; font-size: 9.5px; text-transform: uppercase; letter-spacing: 0.6px; border-bottom: 1px solid rgba(255,255,255,0.08); background: rgba(255,255,255,0.03); }
  .tt-pack-table td { padding: 9px 10px; color: #e2e8f0; border-bottom: 1px solid rgba(255,255,255,0.05); font-family: 'Space Mono', monospace; font-size: 12px; font-weight: 700; }
  .tt-pack-table tr:last-child td { border-bottom: none; }
  .tt-pack-table td:first-child { color: #94a3b8; font-family: 'DM Sans', sans-serif; font-size: 12px; font-weight: 700; }
  .tt-pack-total { display: flex; justify-content: space-between; font-size: 13px; font-weight: 900; padding: 9px 0; margin-top: 4px; border-top: 2px solid rgba(255,255,255,0.12); color: #f1f5f9; }
  .tt-pack-total span { font-family: 'Space Mono', monospace; }
  .tt-it-row { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; padding-top: 10px; border-top: 1px dashed rgba(255,255,255,0.15); font-size: 12px; color: #94a3b8; font-weight: 700; }
  .tt-it-row span { color: #f8fafc; font-family: 'Space Mono', monospace; font-size: 12px; font-weight: 900; }
  .tt-section-label { font-size: 9.5px; text-transform: uppercase; letter-spacing: 1.2px; color: #475569; font-weight: 800; margin-bottom: 8px; margin-top: 14px; padding-bottom: 4px; border-bottom: 1px solid rgba(255,255,255,0.06); }
  
  .name { font-weight: 900; font-size: 16px; color: var(--text-main); margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center;}
  .name-role { font-size: 10px; color: var(--primary); font-weight: 800; text-transform: uppercase; background: #eff6ff; padding: 4px 8px; border-radius: 20px; border: 1px solid #bfdbfe; }
  
  .proc-it-chip { font-size: 9.5px; font-weight: 800; color: #64748b; background: #f1f5f9; border: 1px solid #e2e8f0; border-radius: 5px; padding: 1px 6px; font-family: 'Space Mono', monospace; white-space: nowrap; }
  .proc { display: flex; justify-content: space-between; margin-top: 10px; font-size: 14px; color: var(--text-muted); font-weight: 700; align-items: center; }
  .proc-sub { font-size: 10px; font-weight: 600; color: #94a3b8; padding: 2px 2px 6px 2px; display: flex; gap: 12px; letter-spacing: 0.3px; }
  .proc span:last-child { font-family: 'Space Mono', monospace; font-size: 15px; padding: 2px 8px; border-radius: 6px; background: var(--bg-main); border: 1px solid var(--border); }
  
  .high { color: var(--success) !important; font-weight: 900; }
  .low { color: var(--danger) !important; font-weight: 900; }
  .warn { color: var(--warning) !important; font-weight: 900; }
  
  /* Graphics */
  .graphic-box { margin-top: 18px; padding-top: 18px; border-top: 2px dashed var(--border); }
  .prog-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .prog-label { font-size: 11px; font-weight: 800; text-transform: uppercase; color: var(--text-muted); }
  .prog-val { font-size: 13px; font-weight: 900; color: var(--primary); font-family: 'Space Mono', monospace;}
  .prog-track { height: 14px; background: var(--border); border-radius: 50px; overflow: hidden; display: flex; }
  .prog-bar { height: 100%; border-radius: 50px 0 0 50px; background: linear-gradient(90deg, #3b82f6 0%, #1d4ed8 100%); transition: width 0.8s; flex-shrink: 0; }
  .prog-bar.complete { background: linear-gradient(90deg, #10b981 0%, #059669 100%); border-radius: 50px; }
  .prog-bar-nonit { height: 100%; background: linear-gradient(90deg, #f59e0b 0%, #d97706 100%); flex-shrink: 0; transition: width 0.8s; }
  .it-label { font-size: 11px; font-weight: 700; color: var(--text-muted); display: flex; justify-content: space-between; margin-top: 8px; font-family: 'Space Mono', monospace; }
  .nonit-badge { display:inline-flex; align-items:center; gap:4px; background:#fef3c7; color:#92400e; border:1px solid #fde68a; border-radius:8px; padding:2px 8px; font-size:10px; font-weight:800; margin-left:6px; }
  .nonit-legend { display:flex; gap:12px; margin-top:6px; font-size:10px; font-weight:700; color:var(--text-muted); }
  .nonit-legend-dot { width:10px; height:10px; border-radius:3px; display:inline-block; margin-right:3px; }
  .nonit-reasons-box { margin-top:10px; background:rgba(245,158,11,0.08); border:1px solid rgba(245,158,11,0.25); border-radius:10px; padding:10px 12px; }
  .nonit-reasons-title { font-size:9px; font-weight:800; text-transform:uppercase; letter-spacing:0.8px; color:#92400e; margin-bottom:8px; }
  .nonit-reason-row { display:flex; align-items:center; gap:8px; padding:4px 0; border-bottom:1px solid rgba(245,158,11,0.15); font-size:11px; }
  .nonit-reason-row:last-child { border-bottom:none; }
  .nonit-time { font-family:'Space Mono',monospace; font-size:10px; color:#d97706; font-weight:700; white-space:nowrap; min-width:110px; }
  .nonit-mins { background:#fef3c7; color:#92400e; border-radius:6px; padding:1px 6px; font-size:10px; font-weight:800; white-space:nowrap; }
  .nonit-reason-text { color:var(--text-muted); font-weight:600; font-size:11px; line-height:1.4; }
  .tt-nonit-box { margin-top:12px; padding-top:10px; border-top:1px solid rgba(255,255,255,0.12); }
  .tt-nonit-header { display:flex; justify-content:space-between; align-items:center; font-size:10px; font-weight:800; text-transform:uppercase; letter-spacing:0.6px; color:#f59e0b; margin-bottom:8px; }
  .tt-nonit-total { background:rgba(245,158,11,0.2); color:#fbbf24; padding:2px 8px; border-radius:6px; font-size:10px; font-weight:800; }
  .tt-nonit-row { display:flex; align-items:flex-start; gap:8px; padding:5px 0; border-bottom:1px solid rgba(255,255,255,0.06); font-size:11px; }
  .tt-nonit-row:last-child { border-bottom:none; }
  .tt-nonit-time { font-family:'Space Mono',monospace; font-size:10px; color:#fbbf24; font-weight:700; white-space:nowrap; min-width:105px; }
  .tt-nonit-mins { background:rgba(245,158,11,0.25); color:#f59e0b; border-radius:5px; padding:1px 5px; font-size:10px; font-weight:800; white-space:nowrap; }
  .tt-nonit-reason { color:#94a3b8; font-weight:600; font-size:11px; line-height:1.4; }
  .tt-nonit-csv-row { background:rgba(245,158,11,0.05); border-radius:6px; padding:4px 6px !important; }
  .tt-nonit-csv-label { font-size:10px; color:#d97706; font-weight:700; min-width:100px; }
  .tt-nonit-note { margin-top:8px; padding:7px 10px; background:rgba(99,102,241,0.1); border:1px solid rgba(99,102,241,0.25); border-radius:8px; font-size:11px; color:#a5b4fc; font-weight:600; line-height:1.5; display:flex; gap:7px; align-items:flex-start; }
  .tt-nonit-note-icon { font-size:13px; flex-shrink:0; margin-top:1px; }

  /* Non-IT parse preview */
  .nonit-preview { display:none; margin-top:10px; background:rgba(245,158,11,0.08); border:1px solid rgba(245,158,11,0.25); border-radius:10px; padding:10px 12px; font-size:11px; font-weight:600; color:#92400e; line-height:1.7; }
  .nonit-preview strong { color:#b45309; }

  /* Quick Notes builder */
  .qn-builder { margin-top:12px; background:var(--bg-inner); border:1px solid var(--border); border-radius:12px; padding:14px 16px; }
  .qn-title { font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:0.7px; color:var(--text-muted); margin-bottom:10px; display:flex; align-items:center; gap:6px; }
  .qn-row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:10px; }
  .qn-name, .qn-extra { flex:1 1 200px; min-width:150px; padding:8px 11px; border:2px solid var(--border); border-radius:9px; font-size:13px; font-weight:600; color:var(--text-main); font-family:inherit; background:var(--bg-card); transition:border-color 0.15s; }
  .qn-name:focus, .qn-extra:focus { outline:none; border-color:var(--primary); }
  .qn-tags { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:10px; }
  .qn-tag { background:var(--bg-card); border:1.5px solid var(--border); color:var(--text-muted); border-radius:20px; padding:5px 12px; font-size:11px; font-weight:700; cursor:pointer; transition:all 0.15s; user-select:none; }
  .qn-tag:hover { border-color:#f59e0b; color:#b45309; }
  .qn-tag.sel { background:#fef3c7; border-color:#f59e0b; color:#92400e; }
  .qn-add { background:#d97706; border:none; color:#fff; border-radius:9px; padding:9px 18px; font-size:12px; font-weight:800; cursor:pointer; transition:all 0.15s; white-space:nowrap; }
  .qn-add:hover { background:#b45309; box-shadow:0 3px 10px rgba(217,119,6,0.3); }
  .qn-note-list { margin-top:4px; display:flex; flex-direction:column; gap:6px; }
  .qn-note-item { display:flex; align-items:flex-start; gap:8px; background:rgba(99,102,241,0.07); border:1px solid rgba(99,102,241,0.22); border-radius:9px; padding:7px 10px; font-size:12px; }
  .qn-note-name { font-weight:800; color:#4f46e5; white-space:nowrap; }
  .qn-note-text { color:var(--text-main); font-weight:600; flex:1; line-height:1.4; }
  .qn-note-del { background:none; border:none; color:#94a3b8; cursor:pointer; font-size:16px; font-weight:800; line-height:1; padding:0 2px; flex-shrink:0; }
  .qn-note-del:hover { color:var(--danger); }
  .qn-empty { font-size:11px; color:var(--text-muted); font-style:italic; }

  /* Newhire Section */
  .newhire-section { margin-top: 20px; border-radius: 16px; overflow: hidden; border: 2px dashed rgba(0,0,0,0.12); }
  .newhire-toggle { width: 100%; background: rgba(0,0,0,0.04); border: none; padding: 13px 18px; cursor: pointer; font-family: 'DM Sans', sans-serif; font-weight: 800; font-size: 13px; color: var(--text-muted); display: flex; justify-content: space-between; align-items: center; text-align: left; letter-spacing: 0.3px; }
  .newhire-toggle:hover { background: rgba(0,0,0,0.08); color: var(--text-main); }
  .newhire-toggle .nh-badge { background: #7c3aed; color: white; padding: 3px 10px; border-radius: 20px; font-size: 11px; font-weight: 800; }
  .newhire-toggle .nh-chevron { font-size: 12px; transition: transform 0.2s; }
  .newhire-toggle.open .nh-chevron { transform: rotate(180deg); }
  .newhire-body { display: none; padding: 14px; background: rgba(255,255,255,0.5); }
  .newhire-body.open { display: block; }
  .newhire-summary { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
  .nh-stat { background: white; border: 1px solid var(--border); border-radius: 10px; padding: 8px 14px; font-size: 11px; font-weight: 800; color: var(--text-muted); flex: 1; text-align: center; min-width: 60px; }
  .nh-stat .nh-val { display: block; font-size: 18px; font-weight: 900; color: var(--text-main); margin-top: 2px; font-family: 'Space Mono', monospace; }
  .card.newhire-card { background: #faf5ff; border-color: #e9d5ff; box-shadow: none; }
  .card.newhire-card:hover { border-color: #7c3aed; box-shadow: 0 10px 20px rgba(124,58,237,0.1); }
  .card.newhire-card .name-role { background: #f3e8ff; color: #7c3aed; border-color: #e9d5ff; }
  .card.newhire-card .tt-container { border-color: #7c3aed; }
  .card.newhire-card .tt-container::after { border-top-color: #7c3aed; }

  #error-box { display: none; padding: 15px; background: #fef2f2; border-left: 4px solid var(--danger); color: #991b1b; margin-bottom: 20px; font-size: 14px; border-radius: 8px; font-weight: 600; }
  #error-box.show { display: block; }

  /* ===== Insights / Analytics panels ===== */
  .insights-wrap { max-width:1800px; margin:0 auto 26px auto; display:flex; flex-direction:column; gap:16px; }
  .panel { background:var(--bg-card); border:1px solid var(--border); border-radius:18px; box-shadow:0 4px 6px -1px rgba(0,0,0,0.05); overflow:hidden; }
  .panel-head { display:flex; align-items:center; justify-content:space-between; padding:14px 20px; cursor:pointer; user-select:none; gap:12px; }
  .panel-head h3 { font-size:13px; font-weight:900; text-transform:uppercase; letter-spacing:0.6px; color:var(--text-main); display:flex; align-items:center; gap:8px; }
  .panel-head .chev { font-size:12px; color:var(--text-muted); transition:transform 0.2s; }
  .panel.collapsed .chev { transform:rotate(-90deg); }
  .panel-body { padding:0 20px 18px 20px; }
  .panel.collapsed .panel-body { display:none; }
  .panel-count { background:var(--danger); color:#fff; border-radius:20px; padding:2px 10px; font-size:11px; font-weight:800; }
  .panel-count.ok { background:var(--success); }

  /* Attention list */
  .att-grid { display:flex; flex-direction:column; gap:7px; }
  .att-row { display:flex; align-items:center; gap:10px; padding:8px 12px; border-radius:10px; background:var(--bg-inner); border:1px solid var(--border); }
  .att-row .att-pct { font-family:'Space Mono',monospace; font-weight:900; min-width:52px; text-align:right; }
  .att-row .att-name { font-weight:800; color:var(--text-main); cursor:pointer; }
  .att-row .att-name:hover { color:var(--primary); text-decoration:underline; }
  .att-row .att-meta { font-size:11px; color:var(--text-muted); font-weight:700; flex:1; }
  .att-shift { font-size:10px; font-weight:800; text-transform:uppercase; letter-spacing:0.4px; padding:2px 8px; border-radius:20px; }
  .att-shift.M { background:var(--sup-morning); color:#075985; }
  .att-shift.E { background:var(--sup-evening); color:#92400e; }
  .att-shift.N { background:var(--sup-night); color:#3730a3; }
  .att-empty { color:var(--success); font-weight:700; font-size:13px; padding:6px 2px; }
  .flag-repeat { background:#fee2e2; color:#991b1b; border:1px solid #fecaca; border-radius:6px; padding:1px 7px; font-size:10px; font-weight:800; white-space:nowrap; }

  /* Shift compare */
  .shift-cards { display:grid; grid-template-columns:repeat(3,1fr); gap:14px; }
  .shift-card { border-radius:14px; padding:14px 16px; border:1px solid var(--border); }
  .shift-card.M { background:var(--sup-morning); border-color:var(--sup-morning-border); }
  .shift-card.E { background:var(--sup-evening); border-color:var(--sup-evening-border); }
  .shift-card.N { background:var(--sup-night); border-color:var(--sup-night-border); }
  .shift-card .sc-title { font-size:12px; font-weight:900; color:var(--text-main); margin-bottom:10px; }
  .sc-metrics { display:flex; gap:8px; flex-wrap:wrap; }
  .sc-metric { background:rgba(255,255,255,0.65); border-radius:10px; padding:8px 6px; flex:1; min-width:58px; text-align:center; }
  .sc-metric .v { font-size:19px; font-weight:900; font-family:'Space Mono',monospace; letter-spacing:-0.5px; }
  .sc-metric .k { font-size:9px; font-weight:800; text-transform:uppercase; color:var(--text-muted); letter-spacing:0.3px; margin-top:2px; }

  /* Process scorecard */
  .score-table { width:100%; border-collapse:collapse; font-size:12px; }
  .score-table th { text-align:left; padding:8px 10px; font-size:10px; text-transform:uppercase; letter-spacing:0.5px; color:var(--text-muted); border-bottom:2px solid var(--border); }
  .score-table td { padding:8px 10px; border-bottom:1px solid var(--border); font-weight:700; color:var(--text-main); }
  .score-table th:not(:first-child), .score-table td:not(:first-child) { text-align:center; }
  .score-cell { font-family:'Space Mono',monospace; font-weight:900; }
  .score-bench { font-size:10px; color:var(--text-muted); font-weight:700; display:block; }

  /* Spotlight */
  .spot-cards { display:grid; grid-template-columns:repeat(3,1fr); gap:14px; }
  .spot-card { border-radius:14px; padding:14px 16px; background:linear-gradient(135deg,#fffbeb,#fef3c7); border:1px solid #fde68a; }
  .spot-card .sp-shift { font-size:10px; font-weight:800; text-transform:uppercase; color:#92400e; letter-spacing:0.4px; }
  .spot-card .sp-name { font-size:16px; font-weight:900; color:#1e293b; margin:4px 0; }
  .spot-card .sp-pct { font-family:'Space Mono',monospace; font-weight:900; color:#047857; }
  .spot-streak { font-size:11px; font-weight:800; color:#b45309; margin-top:4px; }
  .spot-none { font-size:13px; color:#92400e; font-weight:700; }

  /* Attendance */
  .att-summary { display:flex; gap:18px; flex-wrap:wrap; margin-bottom:10px; }
  .att-stat { font-size:12px; font-weight:800; color:var(--text-muted); }
  .att-stat b { color:var(--text-main); font-size:16px; font-family:'Space Mono',monospace; }
  .absent-chips { display:flex; flex-wrap:wrap; gap:6px; }
  .absent-chip { background:#fef2f2; border:1px solid #fecaca; color:#991b1b; border-radius:20px; padding:3px 10px; font-size:11px; font-weight:700; }

  /* Sparkline + badges on cards */
  .spark-wrap { display:flex; align-items:center; gap:8px; margin:2px 0 8px 0; }
  .spark-svg { display:block; }
  .trend-arrow { font-size:12px; font-weight:900; font-family:'Space Mono',monospace; white-space:nowrap; }
  .trend-up { color:var(--success); } .trend-down { color:var(--danger); } .trend-flat { color:var(--text-muted); }
  .card-badges { display:flex; flex-wrap:wrap; gap:5px; margin:0 0 8px 0; }
  .cbadge { font-size:9.5px; font-weight:800; border-radius:6px; padding:2px 7px; }
  .cbadge.repeat { background:#fee2e2; color:#991b1b; border:1px solid #fecaca; }
  .cbadge.coach { background:#eef2ff; color:#4338ca; border:1px solid #c7d2fe; cursor:pointer; }
  .cbadge.top { background:#fef9c3; color:#854d0e; border:1px solid #fde68a; }

  /* Modal */
  .modal-overlay { position:fixed; inset:0; background:rgba(15,23,42,0.55); backdrop-filter:blur(3px); z-index:10000; display:none; align-items:flex-start; justify-content:center; padding:40px 16px; overflow-y:auto; }
  .modal-overlay.show { display:flex; }
  .modal { background:var(--bg-card); color:var(--text-main); border-radius:20px; width:100%; max-width:560px; border:1px solid var(--border); box-shadow:0 32px 64px -12px rgba(0,0,0,0.4); overflow:hidden; }
  .modal-head { display:flex; align-items:center; justify-content:space-between; padding:18px 22px; border-bottom:1px solid var(--border); }
  .modal-head h3 { font-size:18px; font-weight:900; }
  .modal-close { background:none; border:none; font-size:24px; cursor:pointer; color:var(--text-muted); line-height:1; }
  .modal-close:hover { color:var(--danger); }
  .modal-body { padding:20px 22px; max-height:70vh; overflow-y:auto; }
  .mp-stats { display:flex; gap:12px; flex-wrap:wrap; margin-bottom:6px; }
  .mp-stat { flex:1; min-width:84px; background:var(--bg-inner); border:1px solid var(--border); border-radius:12px; padding:10px 12px; text-align:center; }
  .mp-stat .v { font-size:22px; font-weight:900; font-family:'Space Mono',monospace; }
  .mp-stat .k { font-size:10px; font-weight:800; text-transform:uppercase; color:var(--text-muted); margin-top:2px; }
  .mp-section-title { font-size:11px; font-weight:900; text-transform:uppercase; letter-spacing:0.6px; color:var(--text-muted); margin:16px 0 8px; }
  .mp-day-row { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:6px 0; border-bottom:1px solid var(--border); font-size:13px; font-weight:700; }
  .mp-day-row .d { color:var(--text-muted); font-family:'Space Mono',monospace; font-size:12px; }
  .mp-note { background:rgba(99,102,241,0.07); border:1px solid rgba(99,102,241,0.22); border-radius:9px; padding:7px 10px; font-size:12px; margin-bottom:6px; }
  .mp-note .d { font-size:11px; color:var(--text-muted); font-weight:800; font-family:'Space Mono',monospace; }
  .coach-item { background:var(--bg-inner); border:1px solid var(--border); border-radius:10px; padding:8px 11px; margin-bottom:6px; font-size:13px; }
  .coach-item .cd { font-size:11px; color:var(--text-muted); font-weight:800; font-family:'Space Mono',monospace; }
  .coach-item .cdel { float:right; cursor:pointer; color:#94a3b8; font-weight:900; }
  .coach-item .cdel:hover { color:var(--danger); }
  .coach-add { display:flex; gap:8px; margin-top:8px; }
  .coach-add input { flex:1; padding:9px 11px; border:2px solid var(--border); border-radius:9px; font-family:inherit; font-size:13px; background:var(--bg-card); color:var(--text-main); }
  .coach-add button { background:var(--primary); color:#fff; border:none; border-radius:9px; padding:9px 16px; font-weight:800; cursor:pointer; }
  .coach-add button:hover { background:var(--primary-dark); }

  /* Daily summary modal */
  .summary-text { width:100%; height:340px; font-family:'Space Mono',monospace; font-size:12px; line-height:1.6; border:2px solid var(--border); border-radius:12px; padding:14px; resize:vertical; background:var(--bg-inner); color:var(--text-main); }
  .copy-row { display:flex; gap:10px; margin-top:12px; }

  /* Data quality bar */
  .dq-bar { max-width:1800px; margin:0 auto 16px auto; background:#eff6ff; border:1px solid #bfdbfe; color:#1e40af; border-radius:12px; padding:10px 16px; font-size:12px; font-weight:700; display:flex; align-items:center; justify-content:space-between; gap:12px; }
  .dq-bar.warn { background:#fffbeb; border-color:#fde68a; color:#92400e; }
  .dq-bar .dq-x { cursor:pointer; font-weight:900; padding:0 4px; }

  /* Theme toggle */
  .theme-toggle { background:var(--bg-card); border:2px solid var(--border); border-radius:10px; padding:10px 14px; font-weight:800; cursor:pointer; color:var(--text-main); }
  .theme-toggle:hover { border-color:var(--primary); color:var(--primary); }

  /* ===== Dark mode ===== */
  body.dark {
    --bg-main:#0b1220; --bg-card:#111a2e; --bg-inner:#0f1830;
    --border:#243049; --text-main:#e5edff; --text-muted:#93a4c4;
    --sup-morning:#0e2236; --sup-evening:#2a2410; --sup-night:#181a39;
    --sup-morning-border:#1d3a55; --sup-evening-border:#4a3f17; --sup-night-border:#2c2f63;
  }
  body.dark input[type="date"], body.dark input[type="text"], body.dark input[type="number"], body.dark textarea,
  body.dark .search-box input, body.dark .sort-box select { background:#0f1830; color:var(--text-main); border-color:var(--border); }
  body.dark .team { background:rgba(255,255,255,0.04); }
  body.dark .proc span:last-child { background:#0f1830; border-color:var(--border); }
  body.dark .file-drop-area, body.dark .settings-panel summary, body.dark .settings-panel { background:#0f1830; }
  body.dark .setup-card, body.dark .sc-metric { background:var(--bg-card); }
  body.dark .att-shift.M { color:#bae6fd; } body.dark .att-shift.E { color:#fde68a; } body.dark .att-shift.N { color:#c7d2fe; }
  body.dark .proc-it-chip, body.dark .name-role { background:#1a2540; border-color:var(--border); }

  /* ===== Responsive (tablet / phone) ===== */
  @media (max-width: 1100px) {
    .grid { flex-direction:column; }
    .shift-cards, .spot-cards { grid-template-columns:1fr; }
    .control-bar { flex-direction:column; align-items:stretch; }
    .controls-left, .controls-right { flex-wrap:wrap; }
    .search-box { max-width:none; }
    .tt-container { width:min(440px,86vw); }
  }
  @media (max-width: 640px) {
    .global-summary { flex-wrap:wrap; gap:14px; }
    .global-metric { border-right:none; flex:1 0 40%; }
    .header { font-size:20px; }
    .settings-grid { grid-template-columns:1fr; }
  }
  
  /* Print Styles - Fully Optimized for PDF Alignment */
  @media print {
    @page { size: landscape; margin: 10mm; }
    body { background: white !important; color: black !important; }
    .control-bar, .tt-container, #setup-page, .day-tabs-wrap, .insights-wrap, .modal-overlay, .dq-bar { display: none !important; }
    #dashboard-output { padding: 0 !important; display: block !important; }
    .grid { display: flex !important; flex-direction: row !important; gap: 10px !important; align-items: stretch !important; }
    .col { width: 33.33% !important; flex: 1 !important; break-inside: avoid; border: 2px solid #e2e8f0 !important; padding: 15px !important; box-shadow: none !important; }
    
    .col.morning { background: #e0f2fe !important; }
    .col.evening { background: #fef3c7 !important; }
    .col.night { background: #e0e7ff !important; }
    
    .card { break-inside: avoid; border: 1px solid #cbd5e1 !important; box-shadow: none !important; padding: 12px !important; }
    .global-summary, .benchmark-bar { break-inside: avoid; border: 1px solid #cbd5e1 !important; box-shadow: none !important; }
    
    .name { font-size: 14px !important; }
    .proc { font-size: 12px !important; }
    
    .high { color: #059669 !important; }
    .low { color: #dc2626 !important; }
    .warn { color: #d97706 !important; }
    .prog-bar { background: #3b82f6 !important; }
    .prog-bar.complete { background: #10b981 !important; }
    .prog-track { background: #e2e8f0 !important; border: 1px solid #cbd5e1 !important; }
  }

  /* ── Popup calculation breakdown ── */
  .tt-calc-block { margin-top:12px; padding:10px 12px; border-radius:10px; background:rgba(96,165,250,0.08); border:1px solid rgba(96,165,250,0.18); }
  .tt-calc-title { font-size:10px; font-weight:900; text-transform:uppercase; letter-spacing:0.8px; color:#93c5fd; margin-bottom:6px; }
  .tt-calc-row { font-family:'Space Mono',monospace; font-size:10.5px; color:#cbd5e1; line-height:1.6; letter-spacing:-0.2px; padding:1px 0; }
  .tt-calc-row strong { color:#fff; font-weight:800; }

  /* ── OVERALL PERFORMANCE BLOCK (pooled output formula) ──
     Overall % = Σ Actual Output ÷ Σ Expected Output × 100, across every process.
     Packing enters as raw S+M units against the re-rated target; the WPI figure
     shown on the Packing row is a display index only and is NOT fed in here. */
