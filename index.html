<script>
  // Captured before anything renders, so "Download Dashboard" can bake the
  // current reports back into a clean copy of this same file.
  const PAGE_SRC = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;

  const DEFAULT_SETTINGS = {
    sup: 'Suresh Singh',
    roster: ['Kulwinder Kumar', 'Varinder Khan', 'Dheeraj Mahajan', 'Sumeet Kumar'],
    pick: 140, stow: 65, packS: 35, packM: 25, packL: 15, docker: 80,
    itGoal: 6.5, goodAt: 100, warnAt: 80
  };
  const LS_KEY = 'yyz3_weekend_v2';
  const PROC_ORDER = ['Stowing', 'Picking', 'Packing', 'Packing (L)', 'Docking'];
  const NON_PERF = ['scanning', 'fulfilment', 'customer handing', 'customer handling'];
  const MONTHS = { jan:1, feb:2, mar:3, apr:4, may:5, jun:6, jul:7, aug:8, sep:9, oct:10, nov:11, dec:12 };
  const MONTH_NAMES = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  const MON_SHORT = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

  // A "report" is one uploaded CSV with its own date range (a week, a month, or
  // anything between). Month tabs are rolled up from the reports that land in
  // that month; overlapping reports are never counted twice.
  let state = { reports: [], settings: Object.assign({}, DEFAULT_SETTINGS), savedAt: 0 };
  let activeKey = null;   // 'ALL' | 'M:2026-09' | 'R:<report key>'

  // ─────────────── helpers ───────────────
  function norm(n) { return (n || '').replace(/_/g, ' ').trim().toLowerCase().replace(/\s+/g, ' '); }
  function esc(s) { return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
  function rn(x) { return Math.round(x || 0).toLocaleString('en-US'); }
  function toDec(t) {
    t = (t || '').trim(); if (!t) return 0;
    const p = t.split(':').map(Number);
    return (p[0] || 0) + (p[1] || 0) / 60 + (p[2] || 0) / 3600;
  }
  function decToStr(x) { const h = Math.floor(x), m = Math.round((x - h) * 60); return h + ':' + String(m).padStart(2, '0') + ':00'; }
  function fmtH(x) {
    x = x || 0; const h = Math.floor(x), m = Math.round((x % 1) * 60);
    if (m === 60) return (h + 1) + 'h';
    return (h > 0 ? h + 'h' : '') + (m > 0 ? (h > 0 ? ' ' : '') + m + 'm' : (h > 0 ? '' : '0h'));
  }
  function cfg() { return state.settings; }
  function colorClass(p) { const c = cfg(); return p >= c.goodAt ? 'high' : (p >= c.warnAt ? 'warn' : 'low'); }
  function ragHex(p) { const c = cfg(); return p >= c.goodAt ? 'var(--success)' : (p >= c.warnAt ? 'var(--warning)' : 'var(--danger)'); }
  function lsGet() { try { return JSON.parse(localStorage.getItem(LS_KEY) || 'null'); } catch (e) { return null; } }
  function lsSet() { try { localStorage.setItem(LS_KEY, JSON.stringify({ reports: state.reports.map(stripReport), settings: state.settings, savedAt: state.savedAt })); } catch (e) {} }
  function stripReport(r) { return { from: r.from, to: r.to, csv: r.csv, file: r.file }; }

  // ─────────────── dates ───────────────
  function parseDate(s) {
    const m = (s || '').trim().match(/^(\d{1,2})\s+([A-Za-z]{3})[A-Za-z]*\s+(\d{4})$/);
    if (!m) return null;
    const mo = MONTHS[m[2].toLowerCase()]; if (!mo) return null;
    return { y: +m[3], m: mo, d: +m[1], iso: m[3] + '-' + String(mo).padStart(2, '0') + '-' + String(+m[1]).padStart(2, '0') };
  }
  function lastDayOf(y, m) { return new Date(y, m, 0).getDate(); }
  function dayShort(iso) { const p = iso.split('-'); return (+p[2]) + ' ' + MON_SHORT[+p[1] - 1]; }
  function monthLabel(mk) { const p = mk.split('-'); return MONTH_NAMES[+p[1] - 1] + ' ' + p[0]; }
  function spanDays(r) { return Math.round((new Date(r.toISO) - new Date(r.fromISO)) / 86400000) + 1; }
  function overlaps(a, b) { return a.fromISO <= b.toISO && b.fromISO <= a.toISO; }

  // Give an uploaded report its key and its tab label.
  function normalizeReport(r) {
    const f = parseDate(r.from), t = parseDate(r.to) || f;
    r.fromISO = f ? f.iso : '0000-00-00';
    r.toISO = t ? t.iso : r.fromISO;
    r.key = r.fromISO + '_' + r.toISO;
    r.month = r.toISO.slice(0, 7);                 // a report belongs to the month it ends in
    if (f && t && f.y === t.y && f.m === t.m && f.d === 1 && t.d === lastDayOf(t.y, t.m)) r.label = monthLabel(r.month);
    else if (f && t && f.y === t.y && f.m === t.m) r.label = f.d + '–' + t.d + ' ' + MON_SHORT[t.m - 1];
    else r.label = dayShort(r.fromISO) + ' – ' + dayShort(r.toISO);
    r.range = dayShort(r.fromISO) + ' → ' + dayShort(r.toISO);
    return r;
  }
  function reportsSorted() { return state.reports.slice().sort((a, b) => a.fromISO.localeCompare(b.fromISO) || a.toISO.localeCompare(b.toISO)); }

  // Month rollups. Within a month the longest report wins; anything overlapping
  // it is left out of the rollup (so a full-month export supersedes the
  // month-to-date one it contains, and separate weeks simply add up).
  function monthGroups() {
    const by = {};
    reportsSorted().forEach(r => { (by[r.month] = by[r.month] || []).push(r); });
    return Object.keys(by).sort().map(mk => {
      const byLen = by[mk].slice().sort((a, b) => spanDays(b) - spanDays(a) || a.fromISO.localeCompare(b.fromISO));
      const used = [], skipped = [];
      byLen.forEach(r => { if (used.some(u => overlaps(u, r))) skipped.push(r); else used.push(r); });
      used.sort((a, b) => a.fromISO.localeCompare(b.fromISO));
      return { mk: mk, label: monthLabel(mk), used: used, skipped: skipped, all: by[mk] };
    });
  }
  function groupFor(mk) { return monthGroups().find(g => g.mk === mk); }

  // ─────────────── CSV ───────────────
  function csvLines(text) {
    let lines = [], p = '', s = true, row = [''], i = 0;
    for (let l of text) {
      if ('"' === l) { if (s && l === p) row[i] += l; s = !s; }
      else if (',' === l && s) l = row[++i] = '';
      else if ('\n' === l && s) { if ('\r' === p) row[i] = row[i].slice(0, -1); lines.push(row); row = ['']; i = 0; }
      else row[i] += l;
      p = l;
    }
    lines.push(row);
    return lines;
  }
  function csvCell(v) { v = v == null ? '' : String(v); return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }

  function detectPeriod(lines, fname) {
    const dates = [];
    for (let j = 0; j < Math.min(2, lines.length); j++) lines[j].forEach(c => { const d = parseDate(c); if (d) dates.push(d); });
    if (dates.length) return { from: lines[0].map(c => (c || '').trim()).filter(c => parseDate(c))[0], to: lines[0].map(c => (c || '').trim()).filter(c => parseDate(c)).pop() };
    const m = (fname || '').match(/(20\d\d)[-_ .]?(\d{1,2})/);
    if (!m) return null;
    const y = +m[1], mo = +m[2];
    return { from: '01 ' + MON_SHORT[mo - 1] + ' ' + y, to: lastDayOf(y, mo) + ' ' + MON_SHORT[mo - 1] + ' ' + y };
  }

  // Keep only the header + the blocks for the supervisor and weekend roster.
  function filterReport(text, fname) {
    const lines = csvLines(text).filter(r => r.join('').trim() !== '');
    const hIdx = lines.findIndex(r => r.some(h => (h || '').trim().toLowerCase() === 'name'));
    if (hIdx < 0) throw new Error('Could not find the "Name" header row in this CSV.');
    const period = detectPeriod(lines, fname);
    if (!period) throw new Error('Could not work out which dates this report covers.');
    const want = new Set([norm(cfg().sup)].concat(cfg().roster.map(norm)));
    const keep = lines.slice(0, hIdx + 1);
    let cur = false; const found = [];
    for (let j = hIdx + 1; j < lines.length; j++) {
      const nm = (lines[j][0] || '').trim();
      if (nm) { cur = want.has(norm(nm)); if (cur) found.push(nm); }
      if (cur) keep.push(lines[j]);
    }
    return { period: period, csv: keep.map(r => r.map(csvCell).join(',')).join('\n'), found: found };
  }

  function parseReport(csv) {
    const lines = csvLines(csv).filter(r => r.join('').trim() !== '');
    const hIdx = lines.findIndex(r => r.some(h => (h || '').trim().toLowerCase() === 'name'));
    const H = lines[hIdx].map(h => (h || '').trim().toLowerCase());
    const col = n => H.indexOf(n);
    const C = { name: col('name'), shift: col('shift'), role: col('role'), proc: col('process'), units: col('productivity'),
                bench: col('productivity benchmark'), it: col('it hours'), nonit: col('non it hours'), tot: col('total it hours'),
                days: col('working days'), doj: col('date of joining') };
    const people = {}; let cur = null;
    for (let j = hIdx + 1; j < lines.length; j++) {
      const r = lines[j], g = i => (i >= 0 ? (r[i] || '').trim() : '');
      if (g(C.name)) {
        cur = { name: g(C.name).replace(/_/g, ' '), shift: g(C.shift), role: g(C.role), doj: g(C.doj),
                totalIT: g(C.tot), nonIT: g(C.nonit), days: parseInt(g(C.days)) || 0, rows: [] };
        people[norm(cur.name)] = cur;
      } else if (cur && g(C.tot) && !cur.totalIT) cur.totalIT = g(C.tot);
      if (cur && g(C.proc)) cur.rows.push({ proc: g(C.proc), units: parseFloat(g(C.units)) || 0, bench: parseFloat(g(C.bench)) || 0, it: toDec(g(C.it)) });
    }
    return people;
  }
  function reportPeople(r) { if (!r._people) r._people = parseReport(r.csv); return r._people; }

  // Merge several reports into one set of people (sums units, benchmark, hours, days)
  function mergePeople(list) {
    if (list.length === 1) return reportPeople(list[0]);
    const out = {};
    list.forEach(r => {
      const mp = reportPeople(r);
      Object.keys(mp).forEach(k => {
        const s = mp[k];
        const t = out[k] || (out[k] = { name: s.name, role: s.role, doj: s.doj, totalIT: '', nonIT: '', days: 0, rows: [], _it: 0, _non: 0, reports: 0 });
        t.role = s.role || t.role; t.doj = s.doj || t.doj;
        t._it += toDec(s.totalIT); t._non += toDec(s.nonIT); t.days += s.days; t.rows = t.rows.concat(s.rows); t.reports++;
        t.totalIT = decToStr(t._it); t.nonIT = decToStr(t._non);
      });
    });
    return out;
  }

  // ─────────────── Calculation (mirrors the daily dashboard) ───────────────
  function applyPackingWPI(a, c) {
    const pk = a.procs['Packing'];
    if (!pk || !pk.breakdown.length) return;
    let sU = 0, sH = 0, mU = 0, mH = 0, hasS = false, hasM = false;
    pk.breakdown.forEach(b => {
      if (b.type === 'Packing (S)') { sU += b.raw; sH += b.itHrs; hasS = true; b.ben = c.packS * b.itHrs; }
      else if (b.type === 'Packing (M)') { mU += b.raw; mH += b.itHrs; hasM = true; b.ben = c.packM * b.itHrs; }
    });
    pk.ben = pk.breakdown.reduce((s, b) => s + (b.ben || 0), 0);
    const sBen = c.packS * sH, mBen = c.packM * mH;
    const achS = sBen > 0 ? sU / sBen * 100 : 0, achM = mBen > 0 ? mU / mBen * 100 : 0;
    const tot = sU + mU; if (tot <= 0) return;
    if (hasS && hasM) {
      const vS = sU / tot, vM = mU / tot;
      pk.wpi = achS * vS + achM * vM;
      pk.wpiLabel = 'WPI &middot; S ' + Math.round(achS) + '%&times;' + Math.round(vS * 100) + '% + M ' + Math.round(achM) + '%&times;' + Math.round(vM * 100) + '%';
    } else if (hasS) { pk.wpi = achS; pk.wpiLabel = 'WPI &middot; S ' + Math.round(achS) + '%&times;100%'; }
    else if (hasM) { pk.wpi = achM; pk.wpiLabel = 'WPI &middot; M ' + Math.round(achM) + '%&times;100%'; }
  }

  function computePerson(p, isSup) {
    const c = cfg();
    const a = { name: p.name, role: isSup ? 'Supervisor' : (p.role && p.role !== '-' ? p.role : 'Weekend'), csvRole: p.role, doj: p.doj || 'N/A',
                isSup: isSup, procs: {}, itDec: toDec(p.totalIT), nonITHrs: toDec(p.nonIT), days: p.days, itStr: p.totalIT || '0:00:00', reports: p.reports || 1 };
    const merged = {};
    p.rows.forEach(r => { const m = merged[r.proc] || (merged[r.proc] = { proc: r.proc, units: 0, bench: 0, it: 0 }); m.units += r.units; m.bench += r.bench; m.it += r.it; });
    Object.values(merged).forEach(r => {
      let proc = r.proc; const low = proc.toLowerCase();
      if (low.includes('return')) return;
      if (NON_PERF.some(np => low.includes(np))) return;     // IT still counts via Total IT Hours
      if (low.includes('newhire')) return;
      const orig = proc;
      if (proc !== 'Packing (L)' && proc.includes('Packing')) proc = 'Packing';
      let ben = r.bench;
      if (!ben || ben <= 0) ben = proc === 'Packing' ? c.packS * r.it : proc === 'Packing (L)' ? c.packL * r.it : proc === 'Picking' ? c.pick * r.it
                               : proc === 'Stowing' ? c.stow * r.it : proc === 'Docking' ? c.docker * r.it : 0;
      const d = a.procs[proc] || (a.procs[proc] = { act: 0, ben: 0, itHrs: 0, breakdown: [] });
      d.act += r.units; d.ben += ben; d.itHrs += r.it;
      d.breakdown.push({ type: orig, raw: r.units, itHrs: r.it, ben: ben });
    });
    applyPackingWPI(a, c);
    const ordered = {};
    PROC_ORDER.forEach(k => { if (a.procs[k]) ordered[k] = a.procs[k]; });
    Object.keys(a.procs).forEach(k => { if (!ordered[k]) ordered[k] = a.procs[k]; });
    a.procs = ordered;
    let tA = 0, tB = 0; Object.values(a.procs).forEach(d => { tA += d.act; tB += d.ben; });
    a.tAct = tA; a.tBen = tB;
    a.overallPct = tB > 0 ? tA / tB * 100 : 0;
    a.itTarget = c.itGoal * a.days;
    a.itPct = a.itTarget > 0 ? (a.itDec + a.nonITHrs) / a.itTarget * 100 : 0;
    a.itPerDay = a.days > 0 ? a.itDec / a.days : 0;
    a.unitsPerDay = a.days > 0 ? tA / a.days : 0;
    return a;
  }

  // Which reports feed a given tab
  function reportsFor(key) {
    if (!key) return [];
    if (key === 'ALL') { let out = []; monthGroups().forEach(g => { out = out.concat(g.used); }); return out; }
    if (key.slice(0, 2) === 'M:') { const g = groupFor(key.slice(2)); return g ? g.used : []; }
    const r = state.reports.find(x => x.key === key.slice(2));
    return r ? [r] : [];
  }
  function titleFor(key) {
    if (key === 'ALL') { const rs = reportsSorted(); return rs.length ? dayShort(rs[0].fromISO) + ' – ' + dayShort(rs[rs.length - 1].toISO) : 'All data'; }
    if (key.slice(0, 2) === 'M:') return monthLabel(key.slice(2));
    const r = state.reports.find(x => x.key === key.slice(2));
    return r ? r.label : '';
  }

  function buildView(key) {
    const c = cfg();
    const rs = reportsFor(key);
    const people = rs.length ? mergePeople(rs) : {};
    const supP = people[norm(c.sup)];
    return {
      sup: supP ? computePerson(supP, true) : null,
      list: c.roster.map(n => people[norm(n)] ? computePerson(people[norm(n)], false) : { name: n, absent: true }),
      reports: rs
    };
  }

  function teamStats(list) {
    const st = { procs: {}, itD: 0, nonIT: 0, itB: 0, days: 0, count: 0, act: 0, ben: 0 };
    list.forEach(a => {
      if (a.absent) return;
      st.count++; st.itD += a.itDec; st.nonIT += a.nonITHrs; st.itB += a.itTarget; st.days += a.days;
      Object.keys(a.procs).forEach(p => { const s = st.procs[p] || (st.procs[p] = { a: 0, b: 0 }); s.a += a.procs[p].act; s.b += a.procs[p].ben; st.act += a.procs[p].act; st.ben += a.procs[p].ben; });
    });
    st.overall = st.ben > 0 ? st.act / st.ben * 100 : 0;
    st.itPct = st.itB > 0 ? (st.itD + st.nonIT) / st.itB * 100 : 0;
    return st;
  }

  // Trend series: month rollups if we're on a month/all tab, otherwise the reports themselves
  function timeline() {
    if (activeKey && activeKey.slice(0, 2) === 'R:') return reportsSorted().map(r => ({ label: r.label, reports: [r] }));
    return monthGroups().map(g => ({ label: g.label, reports: g.used }));
  }
  function seriesFor(name) {
    const isSup = norm(name) === norm(cfg().sup);
    const out = [];
    timeline().forEach(step => {
      const ppl = mergePeople(step.reports); const p = ppl[norm(name)];
      if (p) { const a = computePerson(p, isSup); out.push({ label: step.label, pct: a.overallPct, itPct: a.itPct, itPerDay: a.itPerDay, days: a.days }); }
    });
    return out;
  }
  function sparkSVG(series) {
    const vals = series.map(s => s.pct);
    const W = 64, H = 20, pad = 2, mn = Math.min.apply(null, vals), mx = Math.max.apply(null, vals), rg = (mx - mn) || 1;
    const pts = vals.map((v, i) => [pad + i * (W - 2 * pad) / (vals.length - 1), H - pad - (v - mn) / rg * (H - 2 * pad)]);
    const last = vals[vals.length - 1];
    return '<svg class="spark-svg" width="' + W + '" height="' + H + '" viewBox="0 0 ' + W + ' ' + H + '"><polyline fill="none" stroke="' + ragHex(last) + '" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" points="' +
      pts.map(p => p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' ') + '"/><circle cx="' + pts[pts.length - 1][0].toFixed(1) + '" cy="' + pts[pts.length - 1][1].toFixed(1) + '" r="2.5" fill="' + ragHex(last) + '"/></svg>';
  }
  function trendHTML(series) {
    if (series.length < 2) return '';
    const d = Math.round(series[series.length - 1].pct - series[series.length - 2].pct);
    const cls = d > 2 ? 'trend-up' : d < -2 ? 'trend-down' : 'trend-flat';
    const arrow = d > 2 ? '▲' : d < -2 ? '▼' : '■';
    return '<span class="trend-arrow ' + cls + '" title="vs ' + esc(series[series.length - 2].label) + '">' + arrow + ' ' + (d > 0 ? '+' : '') + d + ' pts</span>';
  }

  // ─────────────── Rendering ───────────────
  function buildCalcHTML(a) {
    const s = cfg();
    const rateOf = { 'Picking': s.pick, 'Stowing': s.stow, 'Packing (L)': s.packL, 'Docking': s.docker };
    let rows = '';
    Object.keys(a.procs).forEach(p => {
      const d = a.procs[p];
      if (p === 'Packing') {
        const sE = d.breakdown.find(b => b.type === 'Packing (S)'), mE = d.breakdown.find(b => b.type === 'Packing (M)');
        const totU = (sE ? sE.raw : 0) + (mE ? mE.raw : 0);
        if (sE && mE && totU > 0) {
          const aS = sE.ben > 0 ? Math.round(sE.raw / sE.ben * 100) : 0, aM = mE.ben > 0 ? Math.round(mE.raw / mE.ben * 100) : 0;
          const vS = Math.round(sE.raw / totU * 100), vM = Math.round(mE.raw / totU * 100);
          rows += '<div class="tt-calc-row">Pack S: ' + fmtH(sE.itHrs) + ' × ' + s.packS + '/hr = ' + rn(sE.ben) + ' → ' + rn(sE.raw) + ' ÷ ' + rn(sE.ben) + ' = <strong>' + aS + '%</strong></div>';
          rows += '<div class="tt-calc-row">Pack M: ' + fmtH(mE.itHrs) + ' × ' + s.packM + '/hr = ' + rn(mE.ben) + ' → ' + rn(mE.raw) + ' ÷ ' + rn(mE.ben) + ' = <strong>' + aM + '%</strong></div>';
          rows += '<div class="tt-calc-row">WPI = (' + aS + '%×' + vS + '%) + (' + aM + '%×' + vM + '%) = <strong>' + Math.round(d.wpi || 0) + '%</strong></div>';
        } else {
          const e = sE || mE, rt = sE ? s.packS : s.packM;
          if (e) rows += '<div class="tt-calc-row">Packing: ' + rn(e.raw) + ' ÷ ' + rn(e.ben) + ' (' + fmtH(e.itHrs) + '×' + rt + ') = <strong>' + Math.round(d.wpi || 0) + '%</strong></div>';
        }
      } else {
        const rate = rateOf[p]; const pct = d.ben > 0 ? Math.round(d.act / d.ben * 100) : 0;
        rows += '<div class="tt-calc-row">' + esc(p) + ': ' + fmtH(d.itHrs) + ' × ' + (rate ? rate + '/hr' : 'sheet rate') + ' = ' + rn(d.ben) + ' → ' + rn(d.act) + ' ÷ ' + rn(d.ben) + ' = <strong>' + pct + '%</strong></div>';
      }
    });
    rows += '<div class="tt-calc-row" style="margin-top:5px">IT Goal: ' + a.days + ' days × ' + s.itGoal + 'h = <strong>' + rn(a.itTarget) + 'h</strong></div>';
    rows += '<div class="tt-calc-row">IT Compliance: (' + fmtH(a.itDec) + ' IT' + (a.nonITHrs > 0 ? ' + ' + fmtH(a.nonITHrs) + ' Non-IT' : '') + ') ÷ ' + rn(a.itTarget) + 'h = <strong>' + Math.round(a.itPct) + '%</strong></div>';
    rows += '<div class="tt-calc-row">Overall Productivity: ' + rn(a.tAct) + ' ÷ ' + rn(a.tBen) + ' = <strong>' + Math.round(a.overallPct) + '%</strong></div>';
    return '<div class="tt-calc-block"><div class="tt-calc-title">📐 Calculations</div>' + rows + '</div>';
  }

  function overallBoxHTML(a) {
    if (a.tBen <= 0) return '<div class="ov-box ov-none"><div class="ov-head"><span class="ov-label">Overall Performance</span><span class="ov-val">--</span></div><div class="ov-formula">No benchmarked output</div></div>';
    const parts = Object.keys(a.procs).map(p => (p === 'Packing' ? 'Pack S+M' : p) + ' ' + rn(a.procs[p].act) + '/' + rn(a.procs[p].ben));
    const pct = Math.round(a.overallPct);
    return '<div class="ov-box"><div class="ov-head"><span class="ov-label">Overall Performance</span><span class="ov-val ' + colorClass(pct) + '">' + pct + '%</span></div>' +
           '<div class="ov-formula">' + rn(a.tAct) + ' actual ÷ ' + rn(a.tBen) + ' expected</div><div class="ov-parts">' + esc(parts.join(' · ')) + '</div></div>';
  }

  function cardHTML(a, topName) {
    if (a.absent) {
      return '<div class="card absent-card"><div class="name"><span>' + esc(a.name) + '</span><span class="name-role" style="background:var(--bg-card);color:var(--text-muted);border-color:var(--border)">No Data</span></div>' +
             '<div class="absent-msg">No hours recorded in this period.</div></div>';
    }
    let pHtml = '', ttRows = '';
    Object.keys(a.procs).forEach(p => {
      const d = a.procs[p];
      let pct = d.ben > 0 ? d.act / d.ben * 100 : 0;
      if (p === 'Packing' && d.wpi != null) pct = d.wpi;
      const cls = colorClass(pct);
      let label = p, sub = '';
      if (p === 'Packing') {
        label = 'Packing (S+M)';
        const sE = d.breakdown.find(b => b.type === 'Packing (S)'), mE = d.breakdown.find(b => b.type === 'Packing (M)');
        const parts = []; if (sE) parts.push('S: ' + rn(sE.raw)); if (mE) parts.push('M: ' + rn(mE.raw));
        if (parts.length) sub = '<div class="proc-sub">' + parts.join(' &middot; ') + '</div>';
      }
      const chip = d.itHrs > 0 ? '<span class="proc-it-chip">' + fmtH(d.itHrs) + '</span>' : '';
      pHtml += '<div class="proc"><span>' + esc(label) + '</span><div style="display:flex;align-items:center;gap:6px">' + chip + '<span class="' + cls + '">' + Math.round(pct) + '%</span></div></div>' + sub;
      if (p === 'Packing') {
        const tr = d.breakdown.map(b => '<tr><td>' + esc(b.type) + '</td><td>' + rn(b.raw) + '</td><td>' + fmtH(b.itHrs) + '</td><td>' + (b.ben > 0 ? rn(b.ben) : '--') + '</td></tr>').join('');
        ttRows += '<div class="tt-section-label">Packing Breakdown</div><table class="tt-pack-table"><thead><tr><th>Type</th><th>Actual Units</th><th>IT Time</th><th>Target</th></tr></thead><tbody>' + tr + '</tbody></table>' +
                  '<div class="tt-pack-total"><span>' + (d.wpi != null ? d.wpiLabel : 'Combined Packing (' + rn(d.act) + ' / ' + rn(d.ben) + ')') + '</span><span class="' + cls + '">' + Math.round(pct) + '%</span></div>';
      } else {
        ttRows += '<div class="tt-row"><span>' + esc(p) + '</span><span class="val ' + cls + '">' + rn(d.act) + ' / ' + rn(d.ben) + ' (' + Math.round(pct) + '%)</span></div>';
      }
    });
    if (a.nonITHrs > 0) ttRows += '<div class="tt-nonit-box"><div class="tt-nonit-header"><span>Non-IT Hours</span><span class="tt-nonit-total">' + fmtH(a.nonITHrs) + '</span></div></div>';
    ttRows += buildCalcHTML(a);

    const series = seriesFor(a.name);
    const spark = series.length >= 2 ? '<div class="spark-wrap" title="Overall % over time">' + sparkSVG(series) + trendHTML(series) + '</div>' : '';
    let badges = '';
    if (a.name === topName && a.overallPct > 0) badges += '<span class="cbadge top">🏆 Top</span>';
    const lowN = series.filter(s => s.pct < cfg().warnAt).length;
    if (lowN >= 2) badges += '<span class="cbadge repeat">⚠ Below ' + cfg().warnAt + '% ×' + lowN + '</span>';

    const chips = '<div class="days-chip"><span>' + a.days + ' day' + (a.days === 1 ? '' : 's') + ' worked</span><span>' + a.itPerDay.toFixed(1) + 'h IT / day</span><span>' + rn(a.unitsPerDay) + ' units / day</span>' +
                  (a.reports > 1 ? '<span>' + a.reports + ' reports</span>' : '') + '</div>';

    const totalHrs = a.itDec + a.nonITHrs;
    const realPct = Math.round(a.itPct);
    const cap = totalHrs > a.itTarget && a.itTarget > 0 ? a.itTarget / totalHrs : 1;
    const itW = a.itTarget > 0 ? a.itDec / a.itTarget * 100 * cap : 0, nonW = a.itTarget > 0 ? a.nonITHrs / a.itTarget * 100 * cap : 0;
    const nonBadge = a.nonITHrs > 0 ? '<span class="nonit-badge">+' + fmtH(a.nonITHrs) + ' Non-IT</span>' : '';
    const bar = '<div class="graphic-box"><div class="prog-header"><span class="prog-label">IT Compliance' + nonBadge + '</span><span class="prog-val">' + realPct + '%</span></div>' +
      '<div class="prog-track"><div class="prog-bar ' + (realPct >= 100 ? 'complete' : '') + '" style="width:' + itW + '%;border-radius:' + (nonW > 0 ? '50px 0 0 50px' : '50px') + '"></div>' +
      (nonW > 0 ? '<div class="prog-bar-nonit" style="width:' + nonW + '%"></div>' : '') + '</div>' +
      '<div class="it-label"><span>' + fmtH(a.itDec) + ' IT' + (a.nonITHrs > 0 ? ' + ' + fmtH(a.nonITHrs) + ' Non-IT' : '') + '</span><span>Goal: ' + rn(a.itTarget) + 'h (' + a.days + '×' + cfg().itGoal + 'h)</span></div></div>';

    return '<div class="card' + (a.isSup ? ' sup-card' : '') + '" onclick="this.classList.toggle(\'pinned\')">' +
      '<div class="tt-container"><div class="tt-header">' + esc(a.name) + '</div><div class="tt-info-grid">' +
        '<div class="info-row"><span>Role on report:</span> <span>' + esc(a.csvRole && a.csvRole !== '-' ? a.csvRole : '—') + '</span></div>' +
        '<div class="info-row"><span>Joined:</span> <span>' + esc(a.doj) + '</span></div>' +
        '<div class="info-row"><span>Days worked:</span> <span>' + a.days + '</span></div>' +
        (a.isSup ? '<div class="info-row"><span>Team totals:</span> <span>Not included (supervisor)</span></div>' : '') +
      '</div>' + ttRows + '</div>' +
      '<div class="name"><span>' + esc(a.name) + '</span><span class="name-role">' + esc(a.role) + '</span></div>' +
      spark + (badges ? '<div class="card-badges">' + badges + '</div>' : '') + chips + pHtml + overallBoxHTML(a) + bar + '</div>';
  }

  function teamBlockHTML(st, label) {
    let rows = '';
    const keys = PROC_ORDER.concat(Object.keys(st.procs).filter(k => PROC_ORDER.indexOf(k) < 0));
    keys.forEach(k => {
      const s = st.procs[k]; if (!s || (s.a === 0 && s.b === 0)) return;
      const pct = s.b > 0 ? s.a / s.b * 100 : 0;
      rows += '<tr><td>' + esc(k === 'Packing' ? 'Packing (S+M)' : k) + '</td><td>' + rn(s.a) + '</td><td>' + rn(s.b) + '</td><td class="' + colorClass(pct) + '">' + Math.round(pct) + '%</td></tr>';
    });
    const tot = st.itD + st.nonIT, pct = Math.round(st.itPct);
    const cap = tot > st.itB && st.itB > 0 ? st.itB / tot : 1;
    const itW = st.itB > 0 ? st.itD / st.itB * 100 * cap : 0, nonW = st.itB > 0 ? st.nonIT / st.itB * 100 * cap : 0;
    return '<div class="team"><div class="sup-data-row"><span class="sup-data-label">' + label + '</span><span class="badge-staff">' + st.count + '</span></div>' +
      '<table class="team-table"><thead><tr><th>Process</th><th>Actual</th><th>Target</th><th>%</th></tr></thead><tbody>' + (rows || '<tr><td colspan="4" style="text-align:left;color:var(--text-muted)">No output recorded</td></tr>') + '</tbody></table>' +
      '<div class="graphic-box"><div class="prog-header"><span class="prog-label">Team IT Goal</span><span class="prog-val">' + pct + '%</span></div>' +
      '<div class="prog-track"><div class="prog-bar ' + (pct >= 100 ? 'complete' : '') + '" style="width:' + itW + '%;border-radius:' + (nonW > 0 ? '50px 0 0 50px' : '50px') + '"></div>' + (nonW > 0 ? '<div class="prog-bar-nonit" style="width:' + nonW + '%"></div>' : '') + '</div>' +
      '<div class="it-label"><span>' + rn(st.itD) + 'h IT' + (st.nonIT > 0 ? ' + ' + fmtH(st.nonIT) + ' Non-IT' : '') + ' completed</span><span>Goal: ' + rn(st.itB) + 'h</span></div></div></div>';
  }

  // Month-over-month table (always by month rollup, whatever tab is open)
  function momTableHTML() {
    const gs = monthGroups(); const c = cfg();
    if (!gs.length) return '';
    const names = [c.sup].concat(c.roster);
    const head = '<tr><th>Associate</th>' + gs.map(g => '<th>' + esc(g.label) + '<span class="mom-sub">' + g.used.length + ' report' + (g.used.length === 1 ? '' : 's') + '</span></th>').join('') + '</tr>';
    let body = '';
    names.forEach((n, idx) => {
      let prev = null;
      body += '<tr><td>' + esc(n) + (idx === 0 ? ' <span class="mom-sub" style="display:inline">(Sup)</span>' : '') + '</td>' + gs.map(g => {
        const p = mergePeople(g.used)[norm(n)];
        if (!p) { prev = null; return '<td><span class="mom-sub">—</span></td>'; }
        const a = computePerson(p, idx === 0);
        const d = prev != null ? Math.round(a.overallPct - prev) : null; prev = a.overallPct;
        const dH = d == null ? '' : '<span class="mom-delta ' + (d > 2 ? 'trend-up' : d < -2 ? 'trend-down' : 'trend-flat') + '">' + (d > 0 ? '+' : '') + d + '</span>';
        return '<td><span class="mom-pct ' + colorClass(a.overallPct) + '">' + Math.round(a.overallPct) + '%</span>' + dH +
               '<span class="mom-sub">' + a.days + 'd · ' + a.itPerDay.toFixed(1) + 'h IT/day · IT ' + Math.round(a.itPct) + '%</span></td>';
      }).join('') + '</tr>';
    });
    body += '<tr class="team-row"><td>Team (excl. supervisor)</td>' + gs.map(g => {
      const st = teamStats(buildView('M:' + g.mk).list);
      return '<td><span class="mom-pct ' + colorClass(st.overall) + '">' + Math.round(st.overall) + '%</span><span class="mom-sub">' + st.days + ' person-days · IT ' + Math.round(st.itPct) + '%</span></td>';
    }).join('') + '</tr>';
    return '<table class="mom-table"><thead>' + head + '</thead><tbody>' + body + '</tbody></table>';
  }

  function renderTabs() {
    const gs = monthGroups();
    let h = gs.map(g => {
      const st = teamStats(buildView('M:' + g.mk).list);
      return '<button class="day-tab' + (activeKey === 'M:' + g.mk ? ' active' : '') + '" onclick="switchTo(\'M:' + g.mk + '\')">' + esc(g.label) +
             '<span class="day-tab-sub">' + Math.round(st.overall) + '%</span></button>';
    }).join('');
    if (gs.length > 1) h += '<button class="day-tab month-tab-all' + (activeKey === 'ALL' ? ' active' : '') + '" onclick="switchTo(\'ALL\')">📊 All</button>';
    document.getElementById('month-tabs').innerHTML = h;

    // Second row: the individual uploaded reports for the month in view
    const rs = reportsSorted();
    let mk = null;
    if (activeKey && activeKey.slice(0, 2) === 'M:') mk = activeKey.slice(2);
    else if (activeKey && activeKey.slice(0, 2) === 'R:') { const r = state.reports.find(x => x.key === activeKey.slice(2)); mk = r ? r.month : null; }
    const row = document.getElementById('report-row');
    const shown = mk ? rs.filter(r => r.month === mk) : rs;
    if (activeKey === 'ALL' || shown.length < 2) { row.style.display = 'none'; document.getElementById('report-tabs').innerHTML = ''; return; }
    row.style.display = 'flex';
    const g = mk ? groupFor(mk) : null;
    document.getElementById('report-tabs').innerHTML = shown.map(r => {
      const st = teamStats(buildView('R:' + r.key).list);
      const dup = g && g.skipped.indexOf(r) >= 0;
      return '<button class="day-tab' + (activeKey === 'R:' + r.key ? ' active' : '') + '" title="' + esc(r.range) + (dup ? ' — overlaps a longer report, so it is left out of the month total' : '') + '" onclick="switchTo(\'R:' + r.key + '\')">' +
        esc(r.label) + (dup ? ' ⓘ' : '') + '<span class="day-tab-sub">' + Math.round(st.overall) + '%</span>' +
        '<span class="day-tab-remove tab-x" title="Remove this report" onclick="event.stopPropagation();removeReport(\'' + r.key + '\')">×</span></button>';
    }).join('');
  }

  function render() {
    const c = cfg();
    const gs = monthGroups();
    const out = document.getElementById('dash-inner');
    if (!state.reports.length) {
      renderTabs();
      document.getElementById('bench-bar').innerHTML = ''; document.getElementById('global-summary').innerHTML = ''; document.getElementById('insights').innerHTML = '';
      out.innerHTML = '<div class="empty-state"><h2>No reports loaded</h2><p>Upload a WH Reporting CSV — a week or a whole month — to build the weekend crew view.</p><button class="action-btn accent" onclick="document.getElementById(\'file-input\').click()">＋ Add CSV</button></div>';
      return;
    }
    const validKeys = ['ALL'].concat(gs.map(g => 'M:' + g.mk), state.reports.map(r => 'R:' + r.key));
    if (!activeKey || validKeys.indexOf(activeKey) < 0) activeKey = 'M:' + gs[gs.length - 1].mk;
    renderTabs();

    const view = buildView(activeKey);
    const st = teamStats(view.list);
    const title = titleFor(activeKey);
    document.getElementById('main-header').textContent = 'Mississauga Weekend Crew — ' + title;
    document.title = 'Weekend Crew — ' + title;

    const rs = view.reports.slice().sort((a, b) => a.fromISO.localeCompare(b.fromISO));
    const period = rs.length ? dayShort(rs[0].fromISO) + ' → ' + dayShort(rs[rs.length - 1].toISO) + (rs.length > 1 ? ' (' + rs.length + ' reports)' : '') : '—';
    document.getElementById('bench-bar').innerHTML =
      '<div>Period: <span>' + esc(period) + '</span></div>' +
      '<div>Picking: <span>' + c.pick + ' / hr</span></div><div>Stowing: <span>' + c.stow + ' / hr</span></div>' +
      '<div>Packing S: <span>' + c.packS + ' / hr</span></div><div>Packing M: <span>' + c.packM + ' / hr</span></div>' +
      '<div>Packing (L): <span>' + c.packL + ' / hr</span></div><div>Docker: <span>' + c.docker + ' / hr</span></div>' +
      '<div>IT Goal: <span>' + c.itGoal + ' hrs / day worked</span></div>';

    const avgItDay = st.days > 0 ? st.itD / st.days : 0;
    document.getElementById('global-summary').innerHTML =
      '<div class="global-metric"><div class="lbl">Team Overall</div><div class="val ' + colorClass(st.overall) + '">' + Math.round(st.overall) + '%</div><div class="sub">' + rn(st.act) + ' ÷ ' + rn(st.ben) + '</div></div>' +
      '<div class="global-metric"><div class="lbl">IT Compliance</div><div class="val ' + colorClass(st.itPct) + '">' + Math.round(st.itPct) + '%</div><div class="sub">' + rn(st.itD + st.nonIT) + 'h of ' + rn(st.itB) + 'h</div></div>' +
      '<div class="global-metric"><div class="lbl">Avg IT / Day</div><div class="val" style="color:' + ragHex(avgItDay / c.itGoal * 100) + '">' + avgItDay.toFixed(1) + 'h</div><div class="sub">goal ' + c.itGoal + 'h</div></div>' +
      '<div class="global-metric"><div class="lbl">Days Worked</div><div class="val">' + st.days + '</div><div class="sub">' + st.count + ' of ' + view.list.length + ' associates</div></div>';

    document.getElementById('insights').innerHTML = gs.length ?
      '<div class="panel"><div class="panel-head" onclick="this.parentNode.classList.toggle(\'collapsed\')"><h3>📈 Month-over-Month</h3><span class="chev">▼</span></div><div class="panel-body" style="overflow-x:auto">' + momTableHTML() + '</div></div>' : '';

    const q = (document.getElementById('search-input').value || '').toLowerCase();
    const sort = document.getElementById('sort-select').value;
    let topName = '', tp = -1;
    view.list.forEach(a => { if (!a.absent && a.tBen > 0 && a.overallPct > tp) { tp = a.overallPct; topName = a.name; } });
    let list = view.list.slice();
    if (sort !== 'default') {
      const val = a => a.absent ? null : (sort === 'it-low' ? a.itPct : a.overallPct);
      list.sort((x, y) => { const vx = val(x), vy = val(y); if (vx == null) return 1; if (vy == null) return -1; return sort === 'perf-high' ? vy - vx : vx - vy; });
    }
    const cards = [];
    if (view.sup && (!q || view.sup.name.toLowerCase().includes(q))) cards.push(cardHTML(view.sup, ''));
    list.forEach(a => { if (!q || a.name.toLowerCase().includes(q)) cards.push(cardHTML(a, topName)); });

    const supTeam = view.sup ? teamStats([view.sup]) : null;
    out.innerHTML = '<div class="col weekend">' +
      '<div class="sup">Weekend Crew — ' + esc(c.sup) + '<span class="sup-sub">Supervisor · ' + esc(title) + '</span></div>' +
      '<div class="team-wrap">' + teamBlockHTML(st, 'Weekend Associates Present') +
        (supTeam ? teamBlockHTML(supTeam, 'Supervisor Own Output (not in team totals)') : '<div class="team"><div class="sup-data-row"><span class="sup-data-label">Supervisor Own Output</span><span class="badge-staff">0</span></div><div class="absent-msg">' + esc(c.sup) + ' has no hours in this period.</div></div>') +
      '</div>' +
      '<div class="card-grid">' + (cards.join('') || '<div class="absent-msg">No associates match your search.</div>') + '</div></div>';
  }

  function switchTo(k) { activeKey = k; render(); window.scrollTo({ top: 0, behavior: 'smooth' }); }
  let lastRemoved = null;
  function removeReport(k) {
    const r = state.reports.find(x => x.key === k); if (!r) return;
    state.reports = state.reports.filter(x => x.key !== k); lastRemoved = r;
    if (activeKey === 'R:' + k) activeKey = null;
    save(); render();
    showDQ('Removed ' + esc(r.label) + ' (' + esc(r.range) + '). <a href="#" onclick="undoRemove();return false" style="color:inherit;font-weight:900">Undo</a>', false);
  }
  function undoRemove() { if (!lastRemoved) return; state.reports.push(lastRemoved); activeKey = 'R:' + lastRemoved.key; lastRemoved = null; save(); hideDQ(); render(); }

  function showDQ(html, warn) { const b = document.getElementById('dq-bar'); b.className = 'dq-bar no-print' + (warn ? ' warn' : ''); b.innerHTML = '<span>' + html + '</span><span class="dq-x" onclick="hideDQ()">×</span>'; b.style.display = 'flex'; }
  function hideDQ() { document.getElementById('dq-bar').style.display = 'none'; }
  function save() { state.savedAt = Date.now(); lsSet(); }

  function handleUpload(ev) {
    const f = ev.target.files && ev.target.files[0]; if (!f) return;
    const rd = new FileReader();
    rd.onload = e => {
      try {
        const res = filterReport(e.target.result, f.name);
        const rep = normalizeReport({ from: res.period.from, to: res.period.to, csv: res.csv, file: f.name });
        const existed = state.reports.some(x => x.key === rep.key);
        state.reports = state.reports.filter(x => x.key !== rep.key);
        state.reports.push(rep);
        activeKey = 'R:' + rep.key; save(); render();
        const c = cfg(); const foundN = new Set(res.found.map(norm));
        const missing = [c.sup].concat(c.roster).filter(n => !foundN.has(norm(n)));
        const g = groupFor(rep.month);
        const dup = g && g.skipped.indexOf(rep) >= 0;
        showDQ((existed ? 'Replaced ' : 'Added ') + esc(rep.label) + ' (' + esc(rep.range) + ') — ' + res.found.length + ' of ' + (c.roster.length + 1) + ' weekend names found.' +
               (missing.length ? ' Not on report: ' + esc(missing.join(', ')) + '.' : '') +
               (dup ? ' It overlaps a longer report for ' + esc(g.label) + ', so the month total still uses the longer one.' : '') +
               ' Use ⬇ Download Dashboard to save a copy with this report built in.', missing.length > 0 || dup);
      } catch (err) { showDQ('Could not read ' + esc(f.name) + ': ' + esc(err.message), true); }
      ev.target.value = '';
    };
    rd.readAsText(f);
  }

  // ─────────────── Settings ───────────────
  function openSettings() {
    const c = cfg();
    document.getElementById('s-sup').value = c.sup; document.getElementById('s-roster').value = c.roster.join('\n');
    ['pick', 'stow', 'packS', 'packM', 'packL', 'docker'].forEach(k => document.getElementById('s-' + k).value = c[k]);
    document.getElementById('s-it').value = c.itGoal; document.getElementById('s-good').value = c.goodAt; document.getElementById('s-warn').value = c.warnAt;
    document.getElementById('settings-modal').classList.add('show');
  }
  function saveSettings() {
    const num = (id, d) => { const v = parseFloat(document.getElementById(id).value); return isNaN(v) ? d : v; };
    const c = cfg();
    state.settings = {
      sup: document.getElementById('s-sup').value.trim() || c.sup,
      roster: document.getElementById('s-roster').value.split('\n').map(s => s.replace(/_/g, ' ').trim()).filter(Boolean),
      pick: num('s-pick', c.pick), stow: num('s-stow', c.stow), packS: num('s-packS', c.packS), packM: num('s-packM', c.packM),
      packL: num('s-packL', c.packL), docker: num('s-docker', c.docker), itGoal: num('s-it', c.itGoal), goodAt: num('s-good', c.goodAt), warnAt: num('s-warn', c.warnAt)
    };
    save(); closeModal('settings-modal'); render();
  }
  function closeModal(id) { document.getElementById(id).classList.remove('show'); }

  // ─────────────── Summary / exports ───────────────
  function summaryText() {
    if (!state.reports.length) return '';
    const view = buildView(activeKey); const st = teamStats(view.list); const c = cfg();
    const rs = view.reports.slice().sort((a, b) => a.fromISO.localeCompare(b.fromISO));
    const L = [];
    L.push('WEEKEND CREW — ' + titleFor(activeKey).toUpperCase());
    if (rs.length) L.push('Period: ' + dayShort(rs[0].fromISO) + ' – ' + dayShort(rs[rs.length - 1].toISO));
    L.push('Supervisor: ' + c.sup);
    L.push('');
    L.push('Team overall: ' + Math.round(st.overall) + '%  (' + rn(st.act) + ' / ' + rn(st.ben) + ')');
    L.push('IT compliance: ' + Math.round(st.itPct) + '%  (' + rn(st.itD + st.nonIT) + 'h of ' + rn(st.itB) + 'h, ' + st.days + ' person-days)');
    L.push('');
    (view.sup ? [view.sup] : []).concat(view.list).forEach(a => {
      if (a.absent) { L.push('• ' + a.name + ' — no hours in this period'); return; }
      const procs = Object.keys(a.procs).map(p => { const d = a.procs[p]; const pc = p === 'Packing' && d.wpi != null ? d.wpi : (d.ben > 0 ? d.act / d.ben * 100 : 0); return (p === 'Packing' ? 'Pack S+M' : p) + ' ' + Math.round(pc) + '%'; }).join(', ');
      L.push('• ' + a.name + (a.isSup ? ' (Sup)' : '') + ' — ' + Math.round(a.overallPct) + '% overall | ' + a.days + ' days | ' + a.itPerDay.toFixed(1) + 'h IT/day (IT ' + Math.round(a.itPct) + '%)');
      if (procs) L.push('    ' + procs);
    });
    return L.join('\n');
  }
  function openSummary() { document.getElementById('summary-text').value = summaryText(); document.getElementById('summary-modal').classList.add('show'); }
  function copySummary() {
    const t = document.getElementById('summary-text'), btn = document.getElementById('copy-btn');
    const ok = () => { const o = btn.textContent; btn.textContent = '✓ Copied!'; setTimeout(() => btn.textContent = o, 1500); };
    if (navigator.clipboard) navigator.clipboard.writeText(t.value).then(ok, () => { t.select(); document.execCommand('copy'); ok(); });
    else { t.select(); document.execCommand('copy'); ok(); }
  }
  function downloadBlob(content, name, type) {
    const b = new Blob([content], { type: type }), u = URL.createObjectURL(b), a = document.createElement('a');
    a.href = u; a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(u), 1000);
  }
  function downloadCSV() {
    const view = buildView(activeKey);
    const rows = [['Period', 'Name', 'Role', 'Days Worked', 'IT Hours', 'Non-IT Hours', 'IT Goal (h)', 'IT Compliance %', 'IT h/day', 'Actual Units', 'Expected Units', 'Overall %']];
    const lbl = titleFor(activeKey);
    (view.sup ? [view.sup] : []).concat(view.list).forEach(a => {
      if (a.absent) { rows.push([lbl, a.name, '', 0, '', '', '', '', '', '', '', '']); return; }
      rows.push([lbl, a.name, a.role, a.days, a.itDec.toFixed(2), a.nonITHrs.toFixed(2), a.itTarget.toFixed(1), Math.round(a.itPct), a.itPerDay.toFixed(2), Math.round(a.tAct), Math.round(a.tBen), Math.round(a.overallPct)]);
    });
    downloadBlob(rows.map(r => r.map(csvCell).join(',')).join('\n'), 'Weekend_Crew_' + lbl.replace(/[^\w]+/g, '_') + '.csv', 'text/csv');
  }
  function downloadHTML() {
    const data = JSON.stringify({ reports: state.reports.map(stripReport), settings: state.settings, savedAt: Date.now() }).replace(/</g, '\\u003c');
    const html = PAGE_SRC.replace(/(<script id="wk-data" type="application\/json">)[\s\S]*?(<\/script>)/, (m0, a, b) => a + data + b);
    downloadBlob(html, 'index.html', 'text/html');
  }

  // ─────────────── Theme ───────────────
  function applyTheme(mode) {
    document.body.classList.toggle('dark', mode === 'dark');
    document.getElementById('theme-toggle').textContent = mode === 'dark' ? '☀️ Light' : '🌙 Dark';
    try { localStorage.setItem('wh_theme', mode); } catch (e) {}
  }
  function toggleTheme() { applyTheme(document.body.classList.contains('dark') ? 'light' : 'dark'); }

  // ─────────────── Boot ───────────────
  (function init() {
    let emb = {};
    try { emb = JSON.parse(document.getElementById('wk-data').textContent || '{}'); } catch (e) {}
    state.reports = (emb.reports || []);
    state.settings = Object.assign({}, DEFAULT_SETTINGS, emb.settings || {});
    state.savedAt = emb.savedAt || 0;
    const ls = lsGet();
    if (ls && ls.savedAt > state.savedAt && Array.isArray(ls.reports)) {
      state.reports = ls.reports; state.settings = Object.assign({}, DEFAULT_SETTINGS, ls.settings || {}); state.savedAt = ls.savedAt;
    }
    state.reports = state.reports.map(normalizeReport);
    let th = 'light'; try { th = localStorage.getItem('wh_theme') || 'light'; } catch (e) {}
    applyTheme(th);
    render();
    document.addEventListener('keydown', e => { if (e.key === 'Escape') { closeModal('summary-modal'); closeModal('settings-modal'); } });
  })();
</script>
</body>
</html>
